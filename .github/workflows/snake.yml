name: snake

on:
schedule:
- cron: "0 0 * * *"
workflow_dispatch:

permissions:
contents: write

jobs:
snake:
runs-on: ubuntu-latest

```
steps:
  - name: Generate contribution snake
    uses: Platane/snk@v3
    with:
      github_user_name: fahmiridho07
      outputs: |
        dist/snake.svg?color_snake=%23FF6B6B&color_dots=%230D1117,%2330363D,%2361DAFB,%23C4B5FD,%23F4B942

  - name: Publish snake
    uses: crazy-max/ghaction-github-pages@v4
    with:
      target_branch: output
      build_dir: dist
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```
